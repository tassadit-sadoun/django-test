[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = 'django'
combine_as_imports = true
include_trailing_comma = true
line_length = 88
multi_line_output = 3
known_first_party = ['config']
known_third_party = ['django', 'rest_framework', 'geopy', 'oauth2_provider']
force_sort_within_sections = true
force_alphabetical_sort_within_sections = true
order_by_type = false

[tool.flake8]
max-line-length = 88
exclude = '.git,__pycache__,env,venv,.venv,.mypy_cache,.pytest_cache'
